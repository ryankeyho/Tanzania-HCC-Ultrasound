# Nginx reverse proxy for the Liver POCUS Course webapp.
#
# This is the PLAIN HTTP version — use it only for initial testing
# immediately after launching the server, before you have a domain name
# pointed at it. Logging in over plain HTTP sends the password in the
# clear over the network. Switch to liverpocus-https.conf (same folder)
# the moment you have a domain — see DEPLOY-AWS.md §5.

server {
    listen 80;
    server_name _;  # replace with your domain once you have one

    client_max_body_size 4M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Nginx reverse proxy WITH HTTPS. Use this once you have a domain name
# pointed at the server's public IP (an A record) — Certbot needs that to
# issue a certificate. See DEPLOY-AWS.md §5 for the exact commands; this
# file is what `certbot --nginx` edits automatically, shown here so you
# can see what it will look like and troubleshoot if something differs.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    # Certbot will add a redirect to HTTPS here automatically.
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    # Certbot fills these in — do not create these paths by hand.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    client_max_body_size 4M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
